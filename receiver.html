<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Receiver – KPSEAS Wilkes</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="receiver-page">
  <div id="normal-view" class="container">
    <header>
      <div class="logo">KPSEAS</div>
      <h1>Wilkes Emergency Alerting System</h1>
      <p class="role-label" id="role-label">Receiver</p>
    </header>

    <main class="receiver-main">
      <div class="status-card">
        <div class="status-icon">🟢</div>
        <h2>Standing By</h2>
        <p>This device is registered as an automatic receiver.<br>
           Alerts from the Front Office will appear here automatically.</p>
      </div>

      <div class="info-box">
        <p><strong>Role:</strong> <span id="role-display">—</span></p>
        <p><strong>Status:</strong> Listening for alerts…</p>
      </div>
    </main>

    <footer>
      <a href="index.html">← Change Role</a>
    </footer>
  </div>

  <!-- Full-screen Alert Overlay -->
  <div id="alert-overlay" class="alert-overlay hidden">
    <div class="alert-content">
      <div class="alert-banner" id="alert-banner">EMERGENCY ALERT</div>
      <div class="alert-type" id="alert-type-display">—</div>
      <div class="alert-note" id="alert-note"></div>
      <div class="alert-voice" id="alert-voice"></div>
      <div class="alert-time" id="alert-time"></div>
      <button id="ack-btn" class="btn-secondary">Acknowledge</button>
    </div>
  </div>

  <audio id="alert-audio" preload="auto"></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/app.js"></script>
  <script src="js/receiver.js"></script>
</body>
</html>
